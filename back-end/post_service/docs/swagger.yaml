            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get all reels by user
      tags:
      - Posts
  /posts/like-post/{postID}:
    post:
      description: Toggle like status for a post
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
