
root = "."
tmp_dir = "tmp"

[build]

  cmd = "go build -o ./tmp/main ./main.go" 

  bin = "tmp/main"


  full_bin = "./tmp/main"


  include_ext = ["go", "toml", "env"]

  exclude_dir = ["tmp"]

  delay = 1000 

  poll = true
  poll_interval = 500

[log]
  level = "debug"

[misc]
  clean_on_exit = true