syntax = "proto3";
package email;

option go_package = "hoshiBmaTchi/back-end/proto";

message OTPRequest {
string recipient = 1;
string code = 2;
}
message WelcomeRequest {
  string recipient = 1;
  string name = 2;
}

message LoginRequest {
  string recipient = 1;
  string name = 2;
}
message GenericEmail {
string recipient = 1;
string subject = 2;
string body = 3;
string name = 4;
}

message EmptyResponse {
bool ok = 1;
string message = 2;
}

service EmailService {
rpc QueueOTPEmail(OTPRequest) returns (EmptyResponse);
rpc QueueWelcomeEmail(GenericEmail) returns (EmptyResponse);
rpc QueueLoginEmail(GenericEmail) returns (EmptyResponse);
}