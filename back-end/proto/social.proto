syntax = "proto3";

package social;

option go_package = "hoshiBmaTchi/back-end/proto";

service SocialService {
  rpc Follow(FollowRequest) returns (FollowResponse);
  rpc Unfollow(UnfollowRequest) returns (UnfollowResponse);
  rpc IsFollowing(IsFollowingRequest) returns (IsFollowingResponse);
  rpc GetFollowersCount(GetFollowersCountRequest) returns (GetFollowersCountResponse);
  rpc GetFollowingCount(GetFollowingCountRequest) returns (GetFollowingCountResponse);
  rpc GetFollowing(GetFollowingRequest) returns (GetFollowingResponse);
  
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  rpc GetComments(GetCommentsRequest) returns (GetCommentsResponse);
  rpc GetCommentReplies(GetCommentRepliesRequest) returns (GetCommentRepliesResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (DeleteCommentResponse);
  rpc LikeComment(LikeCommentRequest) returns (LikeCommentResponse);
  rpc CheckUserCommented(CheckUserCommentedRequest) returns (CheckUserCommentedResponse);
  rpc GetCommentsCount(GetCommentsCountRequest) returns (GetCommentsCountResponse);
}

message FollowRequest {
  string follower_id = 1;
  string following_id = 2;
}

message FollowResponse {
  bool success = 1;
  string message = 2;
  int32 followers_count = 3;
  int32 following_count = 4;
}

message UnfollowRequest {
  string follower_id = 1;
  string following_id = 2;
}

message UnfollowResponse {
  bool success = 1;
  string message = 2;
  int32 followers_count = 3;
  int32 following_count = 4;
}

message IsFollowingRequest {
  string follower_id = 1;
  string following_id = 2;
}

message IsFollowingResponse {
  bool is_following = 1;
}

message GetFollowersCountRequest {
  string user_id = 1;
}

message GetFollowersCountResponse {
  int32 count = 1;
}

message GetFollowingCountRequest {
  string user_id = 1;
}

message GetFollowingCountResponse {
  int32 count = 1;
}

message User {
  string id = 1;
  string username = 2;
  string profile_picture = 3;
}

message GetFollowingRequest {
  string user_id = 1;
}

message GetFollowingResponse {
  repeated User users = 1;
}

message CreateCommentRequest {
  string post_id = 1;
  string parent_comment_id = 2;
  string user_id = 3;
  string text = 4;
  string gif_url = 5;
}

message CreateCommentResponse {
  string id = 1;
  string post_id = 2;
  string parent_comment_id = 3;
  string user_id = 4;
  string text = 5;
  string gif_url = 6;
  int32 likes_count = 7;
  int32 replies_count = 8;
  string created_at = 9;
}

message GetCommentsRequest {
  string post_id = 1;
  int32 page = 2;
  int32 limit = 3;
  string sort = 4;
}

message Comment {
  string id = 1;
  string post_id = 2;
  string parent_comment_id = 3;
  string user_id = 4;
  string text = 5;
  string gif_url = 6;
  int32 likes_count = 7;
  int32 replies_count = 8;
  string created_at = 9;
}

message GetCommentsResponse {
  repeated Comment comments = 1;
}

message GetCommentRepliesRequest {
  string comment_id = 1;
}

message GetCommentRepliesResponse {
  repeated Comment replies = 1;
}

message DeleteCommentRequest {
  string comment_id = 1;
  string user_id = 2;
}

message DeleteCommentResponse {
  bool success = 1;
  string message = 2;
}

message LikeCommentRequest {
  string comment_id = 1;
  string user_id = 2;
}

message LikeCommentResponse {
  bool liked = 1;
  string message = 2;
}

message CheckUserCommentedRequest {
  string post_id = 1;
  string user_id = 2;
}

message CheckUserCommentedResponse {
  bool commented = 1;
}

message GetCommentsCountRequest {
  string post_id = 1;
}

message GetCommentsCountResponse {
  int32 count = 1;
}
